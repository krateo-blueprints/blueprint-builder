# REGISTERS this blueprint as installable. core-provider reads the chart, generates a CRD from its
# values.schema.json, and serves it as composition.krateo.io/v<version>/<plural> — after which a
# claim of that Kind provisions everything the chart declares.
#
# CHART_VERSION is stamped by .github/workflows/release-tag.yaml and the stamped copy is attached
# to the GitHub release, because THIS FILE IS APPLIED BY HAND and is not inside the packaged chart.
# Fetch it from the release rather than this branch, or you will register a literal placeholder.
#
#   kubectl apply -f compositiondefinition.yaml
#
# The namespace must exist first, and is conventionally <name>-system.
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: my-blueprint
  namespace: my-blueprint-system
spec:
  chart:
    # oci://ghcr.io/<owner>/charts/<chart name> — what release-tag.yaml pushes to.
    url: oci://ghcr.io/krateo-blueprints/charts/my-blueprint
    version: CHART_VERSION
